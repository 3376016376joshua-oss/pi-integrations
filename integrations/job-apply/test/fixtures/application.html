<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply: Software Engineer, New Grad</title>
<style>
	.field { margin: 12px 0; }
	.error { color: #b00; }
	[role=listbox] { border: 1px solid #999; }
	[role=listbox][hidden] { display: none; }
	button.active { background: #333; color: #fff; }
	input[type=file] { display: none; }
</style>
</head>
<body>
<h1>Software Engineer, New Grad</h1>
<form id="application">
	<div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
	<div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
	<div class="field"><label for="email">Email *</label><input id="email" type="email" required></div>
	<div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
	<div class="field">
		<label for="resume">Resume/CV *</label>
		<button type="button" onclick="document.getElementById('resume').click()">Attach</button>
		<input id="resume" type="file" required>
	</div>
	<div class="field">
		<label for="sponsorship">Will you now or in the future require sponsorship for employment visa status? *</label>
		<select id="sponsorship" required>
			<option value="">Select...</option>
			<option value="1">Yes</option>
			<option value="0">No</option>
		</select>
	</div>
	<fieldset class="field">
		<legend>Are you legally authorized to work in the United States? *</legend>
		<label><input type="radio" name="authorized" value="yes" required> Yes</label>
		<label><input type="radio" name="authorized" value="no"> No</label>
	</fieldset>
	<div class="field">
		<label id="school-label">School *</label>
		<input id="school" role="combobox" aria-labelledby="school-label" aria-autocomplete="list" aria-controls="school-list" autocomplete="off">
		<div id="school-list" role="listbox" hidden></div>
	</div>
	<div class="field ashby">
		<div class="question-title">Are you open to working onsite 3 days a week? *</div>
		<div class="choices"><button type="button">Yes</button><button type="button">No</button></div>
	</div>
	<div class="field"><label for="why">Why do you want to work at Acme? *</label><textarea id="why" required></textarea></div>
	<div class="field">
		<label for="veteran">Veteran Status</label>
		<select id="veteran">
			<option value="">Select...</option>
			<option>I am a protected veteran</option>
			<option>I am not a protected veteran</option>
			<option>I don't wish to answer</option>
		</select>
	</div>
	<div class="field"><label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label></div>
	<div id="errors" role="alert"></div>
	<button type="submit">Submit Application</button>
</form>
<script>
	const schools = ["University of Washington", "University of Waterloo", "Washington State University"];
	const school = document.getElementById("school");
	const list = document.getElementById("school-list");
	const renderOptions = () => {
		const q = school.value.toLowerCase();
		list.innerHTML = "";
		for (const s of schools.filter((s) => s.toLowerCase().includes(q))) {
			const option = document.createElement("div");
			option.setAttribute("role", "option");
			option.textContent = s;
			option.addEventListener("click", () => { school.value = s; school.dataset.chosen = s; list.hidden = true; });
			list.appendChild(option);
		}
		list.hidden = false;
	};
	school.addEventListener("focus", renderOptions);
	school.addEventListener("click", renderOptions);
	school.addEventListener("input", renderOptions);
	school.addEventListener("keydown", (e) => { if (e.key === "Escape") list.hidden = true; });

	let onsite = "";
	for (const button of document.querySelectorAll(".choices button")) {
		button.addEventListener("click", () => {
			document.querySelectorAll(".choices button").forEach((b) => b.classList.remove("active"));
			button.classList.add("active");
			onsite = button.textContent;
		});
	}

	document.getElementById("application").addEventListener("submit", (event) => {
		event.preventDefault();
		const errors = [];
		const form = event.target;
		for (const el of form.querySelectorAll("[required]")) {
			const empty = el.type === "checkbox" ? !el.checked : el.type === "radio" ? !form.querySelector('input[name="' + el.name + '"]:checked') : el.type === "file" ? el.files.length === 0 : !el.value;
			if (empty) { errors.push("This field is required"); el.setAttribute("aria-invalid", "true"); }
		}
		if (!school.dataset.chosen) errors.push("School is required");
		if (!onsite) errors.push("Onsite answer is required");
		if (errors.length) {
			document.getElementById("errors").textContent = errors.join(". ");
			return;
		}
		window.submitted = {
			first: form.first_name.value,
			sponsorship: document.getElementById("sponsorship").selectedOptions[0].text,
			authorized: form.querySelector('input[name="authorized"]:checked').value,
			school: school.dataset.chosen,
			onsite,
			resume: document.getElementById("resume").files[0].name,
		};
		document.body.innerHTML = "<h1>Thank you for applying!</h1><p>Your application has been submitted.</p>";
	});
</script>
</body>
</html>
